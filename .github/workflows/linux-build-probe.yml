name: Linux build probe

# 临时工作流（验证完就删）：只跑「容器里能不能 import Qt」这一个探针，
# 不打包、不建 release。用来定下 Linux 构建镜像该装哪些库，而不是靠打正式
# 标签去试 —— 标签会走 release 作业，那是会动发布的。
on:
  push:
    paths:
      - '.github/workflows/linux-build-probe.yml'
      - '_probe_in_container.sh'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [original, baselibs, sysfirst]
    steps:
      - uses: actions/checkout@v4

      - name: Probe Qt import in ubuntu:20.04
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:20.04 \
            bash /w/_probe_in_container.sh ${{ matrix.mode }}