name: Linux build probe

# 临时工作流（验证完就删）：在 ubuntu:20.04 里真跑一次 PyInstaller，检查产物
# 有没有 Qt 平台插件。不打包发布、不建 release —— 打标签会走 release 作业，
# 那是会动发布的，不适合拿来试环境。
on:
  push:
    paths:
      - '.github/workflows/linux-build-probe.yml'
      - '_probe_in_container.sh'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a throwaway bundle and inspect it
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:20.04 \
            bash /w/_probe_in_container.sh