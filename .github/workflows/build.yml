name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            display: Windows
          - os: ubuntu-latest
            display: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller labelforge/LabelForge.spec --noconfirm

      - name: Cache pip downloads (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/labelforge-pip-cache
          key: pip-linux-python312-${{ hashFiles('requirements*.txt') }}
          restore-keys: pip-linux-python312-

      - name: Build with PyInstaller (Linux, Docker ubuntu:20.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ runner.temp }}/labelforge-pip-cache:/root/.cache/pip" \
            -w /workspace \
            ubuntu:20.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              # 这些库不只是运行时要的，构建时也必须有：PyInstaller 收集 Qt
              # 平台插件的方式是在构建环境里真的 import Qt、问它插件在哪。
              # 探测失败时它只打一条 warning 就继续，构建照样「成功」，产物
              # 却一个平台插件都没有，启动才报 Could not find the Qt platform
              # plugin —— v2.0.0 的 rc 就这么发出去过一次。缺的就是下面这几组。
              apt-get install -y -qq curl fontconfig binutils \
                libglib2.0-0 libdbus-1-3 libx11-6 libxext6 libxrender1 \
                libxi6 libxtst6 libsm6 libice6 libgl1 libatomic1 \
                libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
                libxcb-cursor0 libxkbcommon-x11-0 libegl1-mesa
              apt-get install -y -qq upx-ucl 2>/dev/null || true

              curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/conda
              /opt/conda/bin/conda install -y python=3.12
              # 版本以 requirements.txt 为准，与 Windows 任务保持一致。
              # 裸装 PySide6 会选 6.10+（manylinux_2_34），20.04 上装不上、只能
              # 靠 pip 的平台标签兜底退回 6.9.x —— 正确性不该押在这上面。
              /opt/conda/bin/python -m pip install -q -r /workspace/requirements.txt -r /workspace/requirements-build.txt

              /opt/conda/bin/python -m PyInstaller labelforge/LabelForge.spec --noconfirm
            "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelForge-${{ matrix.display }}
          path: dist/LabelForge*

  release:
    needs: build
    # 只在 tag 推送时发布。硬防护：下面那步会「先删后建」同 tag 的 release，
    # 而分支推送会让 tag 解析 fallback 到 git describe 的最新 tag（= 删掉一个正式 release）。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts for upload
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p staging
          if [ -f artifacts/LabelForge-Windows/LabelForge.exe ]; then
            cp artifacts/LabelForge-Windows/LabelForge.exe "staging/LabelForge-${TAG}-Windows.exe"
          fi
          if [ -f artifacts/LabelForge-Linux/LabelForge ]; then
            file artifacts/LabelForge-Linux/LabelForge
            cp artifacts/LabelForge-Linux/LabelForge "staging/LabelForge-${TAG}-Linux"
            chmod +x "staging/LabelForge-${TAG}-Linux"
            file "staging/LabelForge-${TAG}-Linux"
          fi

      - name: Create or upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          printf '%s\n' \
            "LabelForge $TAG — 推理支持分割、旋转框与姿态模型" \
            "" \
            "✨ 新功能" \
            "" \
            "• 推理任务扩展：除检测框外，现支持分割、旋转框、姿态三类模型，覆盖 YOLOv8 / YOLO11 / YOLO26" \
            "• 任务自动识别：读取模型自带的元数据判定任务，缺失时按输出形状推断。模型列表每行新增任务下拉，可手动指定自动 / 检测 / 分割 / 旋转框 / 姿态，并显示判定结果" \
            "• 分割：输出多边形标注，顶点起点统一归一到最左上角，与手绘多边形同一口径，类别标签始终落在同一位置" \
            "• 旋转框：输出四角点旋转框，严格顺时针且起点归一到最左上角，与手绘旋转框一致" \
            "• 姿态：实例框与关键点用同一分组号绑定，关键点名称读模型自带配置" \
            "" \
            "🔧 修复" \
            "" \
            "• 旋转框：旋转手柄与角度文字改为画在矩形中心。此前手柄挂在框边外侧，角度文字挤在左上角" \
            "• 旋转框：鼠标拖拽或键盘旋转之后，类别标签会跳到框的另一个角，现始终固定在左上角" \
            "• 区域推理：跨窗口合并结果时，多边形、旋转框与关键点的顶点没有跟着平移，标注整体偏移" \
            "" \
            "📄 格式说明" \
            "" \
            "• 推理结果与手绘标注在显示格式（类别文字、标签位置、摇杆位置、角度文字）与 JSON 格式上完全一致，可混用于同一份标注，一致性由自动化测试逐项校验" \
            > release-notes.md

          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "LabelForge $TAG" \
            --notes-file release-notes.md
          for f in staging/*; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
